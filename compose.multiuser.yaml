# The multi-user deployment: HTTPS reverse proxy, the game server with login (FRX_AUTH=on) and
# PostgreSQL with row-level security. A separate project from the local one (compose.yaml):
#
#   cp deploy/multiuser.env.example deploy/multiuser.env     # fill in, keep it out of git
#   docker compose -f compose.multiuser.yaml --env-file deploy/multiuser.env up -d --build --wait
#   docker compose -f compose.multiuser.yaml --env-file deploy/multiuser.env exec app \
#     python -m frx.admin create-admin <name>                # then: invite --count 5 --days 7
#
# - Only the proxy publishes ports (80, 443); the server and the database are reachable only on
#   the project's own network. The proxy has a fixed address there, and the server believes the
#   forwarded protocol and address from that address alone (FRX_TRUSTED_PROXIES).
# - The server connects as frx_app, a role that owns nothing and cannot bypass row-level
#   security (made by deploy/postgres/10-app-role.sh when the database volume is first created);
#   the schema owner's connection (FRX_MIGRATION_URL) is used only to upgrade the schema at
#   start and by the admin commands.
# - One server process only: turns in flight and the work after them live in its memory.
# - The administrators of the database can read every player's saves.
# More in docs/accounts-and-isolation-plan.md, 部署.
name: frx-multi
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: frx
      POSTGRES_USER: frx
      POSTGRES_PASSWORD: ${FRX_DB_OWNER_PASSWORD:?FRX_DB_OWNER_PASSWORD 未设置}
      FRX_DB_APP_PASSWORD: ${FRX_DB_APP_PASSWORD:?FRX_DB_APP_PASSWORD 未设置}
    volumes:
      - saves:/var/lib/postgresql/data
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      inside:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frx -d frx"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  app:
    build: .
    env_file:
      - path: ${FRX_MODEL_ENV_FILE:-.env}
        required: false
    environment:
      FRX_AUTH: "on"
      FRX_REGISTRATION: ${FRX_REGISTRATION:-invite}
      FRX_DATABASE_URL: postgresql+psycopg://frx_app:${FRX_DB_APP_PASSWORD}@db:5432/frx
      FRX_MIGRATION_URL: postgresql+psycopg://frx:${FRX_DB_OWNER_PASSWORD}@db:5432/frx
      FRX_ALLOWED_HOSTS: ${FRX_HOST:?FRX_HOST 未设置（对外的域名）}
      FRX_TRUSTED_PROXIES: 172.31.250.10
      FRX_DATA_DIR: /data
      FRX_LIMIT_COST: ${FRX_LIMIT_COST:-3}
      FRX_LIMIT_TURNS: ${FRX_LIMIT_TURNS:-200}
      FRX_LIMIT_CONCURRENT: ${FRX_LIMIT_CONCURRENT:-2}
      FRX_LIMIT_SERVER_TURNS: ${FRX_LIMIT_SERVER_TURNS:-6}
      FRX_LIMIT_SAVES: ${FRX_LIMIT_SAVES:-50}
      FRX_LIMIT_SAVE_MB: ${FRX_LIMIT_SAVE_MB:-50}
      FRX_LIMIT_IMAGE_MB: ${FRX_LIMIT_IMAGE_MB:-200}
      FRX_SESSION_DAYS: ${FRX_SESSION_DAYS:-30}
    volumes:
      - runtime:/data
    networks:
      inside:
        ipv4_address: 172.31.250.20
    depends_on:
      db:
        condition: service_healthy
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 30
      start_period: 20s
    restart: unless-stopped
  proxy:
    image: caddy:2.10.0-alpine
    environment:
      FRX_HOST: ${FRX_HOST}
    # 80 and 443 on every address of the server. A rehearsal beside other services publishes
    # elsewhere: FRX_HTTPS_PORT=127.0.0.1:9225 (docs/container-install.md, 本机演练).
    ports:
      - "${FRX_HTTP_PORT:-80}:80"
      - "${FRX_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - proxy-config:/config
    networks:
      inside:
        ipv4_address: 172.31.250.10
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
networks:
  inside:
    ipam:
      config:
        - subnet: 172.31.250.0/24
volumes:
  saves:
  runtime:
  certificates:
  proxy-config:
