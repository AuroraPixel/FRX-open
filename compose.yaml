name: frx-local
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: frx
      POSTGRES_USER: frx
      POSTGRES_PASSWORD: frx-local
    ports:
      - "127.0.0.1:${FRX_DB_PORT:-55432}:5432"
    volumes:
      - saves:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frx -d frx"]
      interval: 2s
      timeout: 3s
      retries: 30
  web:
    profiles: [web]
    build: .
    env_file:
      - path: ${FRX_MODEL_ENV_FILE:-.env}
        required: false
    environment:
      FRX_DATABASE_URL: postgresql+psycopg://frx:frx-local@db:5432/frx
      FRX_DATA_DIR: /data
    ports:
      - "127.0.0.1:${FRX_WEB_PORT:-8787}:8787"
    volumes:
      - runtime:/data
    depends_on:
      db:
        condition: service_healthy
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 30
      start_period: 20s
volumes:
  saves:
  runtime:
